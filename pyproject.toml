[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdnmc-nova"
version = "0.0.1"
description = "BdNMC light-dark-matter event generation for the NOvA Near Detector: detector frame, TextFileGen input, container and job recipes"
requires-python = ">=3.11"
license = {text = "MIT"}
# bdnmc-jax: the JAX port in RobMina/BdNMC (branch gpu-port, subdirectory gpu)
# hep-endpoints: job submission (RobMina/hep-endpoints, standard-library only), pinned to a commit (branch
# slurm-dependency: Slurm job dependencies)
dependencies = ["numpy", "bdnmc-jax @ git+https://github.com/RobMina/BdNMC.git@gpu-port#subdirectory=gpu",
                "hep-endpoints @ git+https://github.com/RobMina/hep-endpoints.git@31de7e6dd436fcb9cd901765f4330d155c9405b7"]

[project.optional-dependencies]
test = ["pytest", "h5py"]

[tool.setuptools.packages.find]
include = ["bdnmc_nova*"]

[tool.setuptools.package-data]
bdnmc_nova = ["data/*.sh", "data/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
